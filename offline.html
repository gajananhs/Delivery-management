<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Offline — Direct Dispatch & Fleet Controller</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020617">
<style>
  html, body {
    margin: 0; height: 100%;
    background-color: #020617;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  .card { padding: 32px; max-width: 380px; }
  .icon {
    width: 64px; height: 64px; margin: 0 auto 20px;
    border-radius: 16px; background: #4f46e5;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 22px; color: #fff;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: #94a3b8; line-height: 1.5; margin: 0 0 20px; }
  button {
    background: #4f46e5; color: #fff; border: 0; border-radius: 10px;
    padding: 10px 20px; font-weight: 700; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">DD</div>
    <h1>You're offline</h1>
    <p>No internet connection right now. Any pages you've already opened are available, but live dispatch data and API actions need a connection.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
