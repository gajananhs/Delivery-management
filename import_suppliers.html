<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Import Suppliers</title>

  <!-- PWA: manifest + icons + theme color -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#020617">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <script src="assets/pwa-controller.js" defer></script>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-white text-slate-800 rounded-2xl shadow-2xl p-6 space-y-4">
    <div>
      <h1 class="text-lg font-bold">Import Suppliers</h1>
      <p class="text-xs text-slate-500 mt-1">
        Upload the file exported from canaresai.com &rarr; Procurement &rarr; Suppliers &rarr;
        <span class="font-semibold">Export</span> &mdash; either the CSV as downloaded, or that
        same file re-saved as .xlsx. Re-uploading a newer export is safe: existing supplier codes
        are updated, new codes are added.
      </p>
    </div>

    <form id="import-form" class="space-y-3">
      <input type="file" name="file" id="csv-file" accept=".csv,.xlsx" required
        class="w-full text-xs border border-slate-200 rounded-xl p-2.5 outline-none focus:border-indigo-500">
      <button type="submit" id="import-btn"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-bold text-sm shadow-md transition-colors">
        Upload &amp; Import
      </button>
    </form>

    <div id="result" class="hidden text-xs rounded-xl p-3 border"></div>

    <a href="index.html" class="block text-center text-xs text-indigo-600 font-semibold pt-1">
      &larr; Back to Dispatch Dashboard
    </a>
  </div>

  <script>
    // The PHP backend only runs on Hostinger — if this page is opened from
    // GitHub Pages (or anywhere else), it still needs to talk to that
    // Hostinger API directly, since GitHub Pages can't run PHP itself.
    const API_BASE = 'https://canaresonline.com/Delivery_management/api/';

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    document.getElementById('import-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('csv-file');
      const btn = document.getElementById('import-btn');
      const resultBox = document.getElementById('result');

      if (!fileInput.files.length) return;

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      btn.disabled = true;
      btn.textContent = 'Importing...';
      resultBox.classList.add('hidden');

      let res;
      try {
        res = await fetch(API_BASE + 'import_suppliers_api.php', { method: 'POST', body: formData });
      } catch (networkErr) {
        // The request never reached the server at all (offline, DNS, CORS, mixed-content HTTP/HTTPS)
        resultBox.classList.remove('hidden');
        resultBox.className = 'text-xs rounded-xl p-3 border bg-red-50 border-red-200 text-red-800';
        resultBox.textContent = `Network error: could not send the request at all (${networkErr.message}). Check you're on the same https:// domain as this page.`;
        btn.disabled = false;
        btn.textContent = 'Upload & Import';
        return;
      }

      // Read as text first: a PHP fatal error or a 404 page comes back as
      // HTML, not JSON, and res.json() would just throw a useless
      // "unexpected token" error that hides what actually went wrong.
      const rawText = await res.text();
      let data = null;
      try {
        data = JSON.parse(rawText);
      } catch (parseErr) {
        resultBox.classList.remove('hidden');
        resultBox.className = 'text-xs rounded-xl p-3 border bg-red-50 border-red-200 text-red-800';
        resultBox.innerHTML = `Server returned HTTP ${res.status} but not valid JSON, so something failed before the PHP script could respond ` +
          `(missing api/import_suppliers_api.php on the server, a wrong path to database_configuration.php, or a PHP error). Raw response:<br>` +
          `<code class="block mt-1 p-2 bg-red-100 rounded text-[10px] whitespace-pre-wrap break-all">${escapeHtml(rawText.slice(0, 500)) || '(empty response)'}</code>`;
        btn.disabled = false;
        btn.textContent = 'Upload & Import';
        return;
      }

      resultBox.classList.remove('hidden');
      if (data.status === 'success') {
        resultBox.className = 'text-xs rounded-xl p-3 border bg-emerald-50 border-emerald-200 text-emerald-800';
        resultBox.innerHTML = `Imported successfully &mdash; <b>${data.data.created}</b> added, <b>${data.data.updated}</b> updated.` +
          (data.data.errors.length ? `<br><span class="text-amber-700">${data.data.errors.length} row(s) skipped: ${data.data.errors.join('; ')}</span>` : '');
      } else {
        resultBox.className = 'text-xs rounded-xl p-3 border bg-red-50 border-red-200 text-red-800';
        resultBox.textContent = data.message || `Import failed (HTTP ${res.status}).`;
      }
      btn.disabled = false;
      btn.textContent = 'Upload & Import';
    });
  </script>
</body>
</html>
